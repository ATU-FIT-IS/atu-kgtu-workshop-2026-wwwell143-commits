<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="ai-glow"></div>
    <title>AI Career Coach</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🤖 AI Career Coach</h1>
        <p>Умный помощник для выбора профессии будущего</p>
    </header>

<section class="card">
    <h2>Возможности системы</h2>
    <ul>
        <li>📄 Анализ резюме</li>
        <li>💼 Подбор профессий</li>
        <li>🎓 Рекомендации по курсам</li>
        <li>📈 Прогноз востребованности навыков</li>
    </ul>
</section>

<section class="card">
    <h2>Введите данные о себе</h2>

    <textarea id="skills" rows="8" placeholder="Например:

Образование: Студент IT

Навыки:
Python, HTML, CSS, JavaScript, SQL

Интересы:
Искусственный интеллект, Веб-разработка"></textarea>

    <button onclick="analyzeSkills()">
        Проанализировать
    </button>
</section>

<section class="card">
    <h2>Результат анализа</h2>
    <div id="result">
        Здесь появятся рекомендации...
    </div>
</section>

<script src="script.js"></script>

</body>
</html>
